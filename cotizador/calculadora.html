<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/cotizador/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faede1">
<title>Calculadora · La Vuelta</title>
<style>
:root{--vino:#8c2628;--crema:#faede1;--celeste:#b1c3c7;--azul:#4a94c4;--texto:#3b2b2b;--gris:#6f5f5f;--linea:#e3cfc2;--oliva:#6b7a4f;--mono:"Courier New",Courier,monospace;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
header img{width:100px}
header h1{font-family:var(--mono);font-size:14px;letter-spacing:3px;color:var(--vino);margin:0;text-transform:uppercase;text-align:right}
.volver{font-size:14px;font-weight:bold;color:var(--vino);text-decoration:none}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(59,43,43,.07)}
.flbl{font-family:var(--mono);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:var(--gris);margin-bottom:6px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;font:16px Arial,Helvetica,sans-serif;padding:11px;border:1px solid #d8c3b4;border-radius:8px;background:#fff;color:var(--texto)}
input{font-size:22px;font-weight:bold;color:var(--vino)}
input:focus,select:focus{outline:2px solid var(--azul);outline-offset:1px}
.info{font-size:13.5px;color:var(--gris);margin-top:10px;line-height:1.5}
.info b{color:var(--texto)}
.atajos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--celeste);background:#fff;color:var(--texto);border-radius:999px;padding:8px 13px;font:bold 13.5px Arial,Helvetica,sans-serif;cursor:pointer}
.chip:active{background:var(--crema)}
.aviso{color:#b00020;font-weight:bold;font-size:13.5px;margin-top:8px}
.aviso:empty{display:none}
.linea{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.linea:last-child{border-bottom:0}
.linea .l{font-family:var(--mono);font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:var(--gris)}
.linea .l small{display:block;font-family:Arial,Helvetica,sans-serif;letter-spacing:0;text-transform:none;font-weight:normal;font-size:12px;margin-top:2px}
.linea .v{font-size:17px;font-weight:bold;white-space:nowrap}
.menos .v::before{content:"− ";color:var(--gris);font-weight:normal}
.desc .v{color:var(--oliva)}
.total{background:var(--vino);color:var(--crema);border-radius:10px;padding:14px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.total .l{font-family:var(--mono);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
.total .v{font-size:24px;font-weight:bold}
.ahorro{background:var(--oliva);color:#fff;border-radius:10px;padding:10px 14px;margin-top:10px;display:flex;justify-content:space-between;font-size:14px}
.ahorro b{font-size:16px}
.generar{width:100%;margin-top:12px;background:var(--vino);color:var(--crema);border:0;border-radius:10px;padding:14px;font:bold 15px Arial,Helvetica,sans-serif;cursor:pointer}
.nota{font-size:12px;color:var(--gris);margin-top:12px;line-height:1.4}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="volver" id="volver" href="/cotizador/">← Cotizador</a>
    <img src="img/logo.png" alt="La Vuelta">
    <h1>Calculadora</h1>
  </header>

  <div class="card">
    <div class="grid">
      <div><label class="flbl" for="piso">Piso</label><select id="piso"></select></div>
      <div><label class="flbl" for="unidad">Departamento</label><select id="unidad"></select></div>
    </div>
    <div class="info" id="info">Cargando…</div>
  </div>

  <div class="card">
    <label class="flbl" for="pago">Pago anticipado $</label>
    <input id="pago" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <div class="atajos" id="atajos"></div>
    <div class="aviso" id="aviso"></div>
  </div>

  <div class="card">
    <div class="linea"><span class="l">Valor del departamento</span><span class="v" id="rPrecio"></span></div>
    <div class="linea menos"><span class="l">Entrada (5%)</span><span class="v" id="rEntrada"></span></div>
    <div class="linea menos"><span class="l">Pago anticipado</span><span class="v" id="rPago"></span></div>
    <div class="linea menos desc"><span class="l">Descuento<small>10% del pago anticipado</small></span><span class="v" id="rDesc"></span></div>
    <div class="total"><span class="l">Contra entrega</span><span class="v" id="rEntrega"></span></div>
    <div class="ahorro"><span>Precio final con descuento</span><b id="rFinal"></b></div>
    <p class="nota">Contra entrega = valor del departamento − entrada − pago anticipado − descuento.</p>
    <button class="generar" id="btnCot" type="button">Generar cotización con este pago</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const usd=n=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const qs=new URLSearchParams(location.search);
let U=[];

function parseCSV(t){ const [h,...rs]=t.trim().split(/\r?\n/); const k=h.split(",");
  return rs.map(r=>{const v=r.split(",");const o={};k.forEach((x,i)=>o[x]=v[i]);o.precio=+o.precio;return o;}); }
const actual=()=>U.find(u=>u.unidad===$("#unidad").value);
const leerPago=()=>{ const v=parseFloat($("#pago").value.replace(/[^\d.]/g,"")); return isFinite(v)?v:0; };

function llenarUnidades(){
  $("#unidad").innerHTML=U.filter(u=>u.piso===$("#piso").value).map(u=>{
    const ok=(u.estado||"").toLowerCase()==="disponible";
    return `<option value="${u.unidad}" ${ok?"":"disabled"}>${u.unidad} · Tipo ${u.tipologia}${ok?"":" · "+u.estado}</option>`;
  }).join("");
  const p=[...$("#unidad").options].find(o=>!o.disabled); if(p) $("#unidad").value=p.value;
}

function calcular(){
  const u=actual(); if(!u) return;
  const precio=u.precio, entrada=r2(precio*0.05);
  const maximo=Math.floor((precio-entrada)/1.1*100)/100;   // así el contra entrega nunca queda negativo
  let pago=leerPago(); $("#aviso").textContent="";
  if(pago>maximo){ $("#aviso").textContent=`El pago anticipado máximo para este departamento es ${usd(maximo)}.`; pago=maximo; }
  const desc=r2(pago*0.10), entrega=r2(precio-entrada-pago-desc);

  $("#info").innerHTML=`<b>Dpt ${u.unidad}</b> · Piso ${u.piso} · Tipología ${u.tipologia} · ${u.dormitorios} dorm. · ${(+u.area_total).toFixed(2)} m²`;
  $("#rPrecio").textContent=usd(precio); $("#rEntrada").textContent=usd(entrada);
  $("#rPago").textContent=usd(pago); $("#rDesc").textContent=usd(desc);
  $("#rEntrega").textContent=usd(entrega); $("#rFinal").textContent=usd(precio-desc);

  const saldo=precio-entrada;
  $("#atajos").innerHTML=[["25%",.25],["50%",.5],["75%",.75],["Máximo",1]].map(([l,f])=>{
    const v=f===1?maximo:Math.round(saldo*f/100)*100; return `<button type="button" class="chip" data-v="${v}">${l} · ${usd(v).replace(/\.00$/,"")}</button>`;
  }).join("");
}

$("#atajos").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; $("#pago").value=(+b.dataset.v).toLocaleString("en-US"); calcular(); });
$("#pago").addEventListener("input",calcular);
$("#btnCot").addEventListener("click",()=>{
  const u=actual(); if(!u) return;
  const maximo=Math.floor((u.precio-Math.round(u.precio*5)/100)/1.1*100)/100;
  const p=new URLSearchParams(); ["nombre","cel","correo","ci"].forEach(k=>{ if(qs.get(k)) p.set(k,qs.get(k)); });
  p.set("unidad",u.unidad); p.set("anticipado",Math.min(leerPago(),maximo));
  location.href="/cotizador/?"+p;
});
$("#pago").addEventListener("blur",()=>{ const v=leerPago(); if(v) $("#pago").value=v.toLocaleString("en-US",{maximumFractionDigits:2}); });
$("#piso").addEventListener("change",()=>{ llenarUnidades(); calcular(); });
$("#unidad").addEventListener("change",calcular);

fetch("unidades.csv",{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(t=>{
  U=parseCSV(t);
  $("#piso").innerHTML=[...new Set(U.map(u=>u.piso))].map(p=>`<option value="${p}">Piso ${p}</option>`).join("");
  const pedida=qs.get("unidad") && U.find(u=>u.unidad===qs.get("unidad"));
  if(pedida) $("#piso").value=pedida.piso;
  llenarUnidades(); if(pedida) $("#unidad").value=pedida.unidad;
  calcular();
}).catch(()=>{ $("#info").textContent="No se pudo leer unidades.csv."; });
</script>
</body>
</html>
