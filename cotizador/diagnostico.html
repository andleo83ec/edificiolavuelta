<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/cotizador/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico · La Vuelta</title>
<script src="plan.js"></script>
<style>
body{margin:0;background:#faede1;color:#3b2b2b;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Courier New",monospace;letter-spacing:3px;color:#8c2628;font-size:15px;text-transform:uppercase}
.p{background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:10px;font-size:14px;line-height:1.45;border-left:5px solid #b1c3c7}
.p.ok{border-color:#6b7a4f}.p.mal{border-color:#b00020}
.p b{display:block;margin-bottom:3px}
code{font-size:12px;word-break:break-all;color:#6f5f5f}
</style>
</head>
<body><div class="wrap">
<h1>Diagnóstico del cotizador</h1>
<div id="out"></div>
<p style="font-size:12px;color:#6f5f5f">Toma una captura de esta pantalla y envíala.</p>
</div>
<script>
const out=document.getElementById("out");
const paso=(ok,t,d)=>out.insertAdjacentHTML("beforeend",`<div class="p ${ok===null?"":ok?"ok":"mal"}"><b>${ok===null?"•":ok?"✅":"❌"} ${t}</b>${d||""}</div>`);
(async()=>{
  const C=window.LV_CONFIG;
  paso(!!window.LV_VERSION,"plan.js actualizado", window.LV_VERSION?`Versión: ${window.LV_VERSION}`:"Se está usando un plan.js anterior. Súbelo de nuevo a la carpeta cotizador.");
  paso(!!(C&&C.fuenteDatos),"Enlace de la hoja en plan.js", C&&C.fuenteDatos?`<code>${C.fuenteDatos}</code>`:"fuenteDatos está vacío.");
  for(const pg of ["index.html","explorar.html","calculadora.html"]){
    try{ const t=await (await fetch(pg,{cache:"no-store"})).text();
      paso(t.includes("lvCargarUnidades"),`${pg} actualizado`, t.includes("lvCargarUnidades")?"Lee la hoja de Google.":"Es una versión anterior que solo lee unidades.csv. Súbela de nuevo."); }
    catch(e){ paso(false,`${pg}`, "No se pudo abrir: "+e.message); }
  }
  if(C&&C.fuenteDatos){
    try{
      const r=await fetch(C.fuenteDatos+"&t="+Date.now(),{cache:"no-store"});
      paso(r.ok,"Conexión con la hoja de Google",`Respuesta ${r.status}`);
      const txt=await r.text(); const u=lvParseCSV(txt);
      const res=u.filter(x=>x.estado!=="Disponible");
      paso(u.length>0,"Lectura de unidades",`${u.length} unidades · ${res.length} no disponibles${res.length?": "+res.map(x=>x.unidad+" ("+x.estado+")").join(", "):""}`);
    }catch(e){ paso(false,"Conexión con la hoja de Google","El navegador bloqueó la lectura: "+e.message); }
  }
  try{ const u=await lvCargarUnidades(); paso(null,"Datos que usa el cotizador",`${u.length} unidades · ${u.filter(x=>x.estado!=="Disponible").length} no disponibles`); }
  catch(e){ paso(false,"Datos que usa el cotizador",e.message); }
})();
</script>
</body></html>
