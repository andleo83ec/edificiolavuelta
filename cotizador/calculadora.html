<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/cotizador/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faede1">
<title>Calculadora · La Vuelta</title>
<script src="plan.js"></script>
<style>
:root{--vino:#8c2628;--crema:#faede1;--celeste:#b1c3c7;--azul:#4a94c4;--texto:#3b2b2b;--gris:#6f5f5f;--linea:#e3cfc2;--oliva:#6b7a4f;--mono:"Courier New",Courier,monospace;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
header img{width:100px}
header h1{font-family:var(--mono);font-size:14px;letter-spacing:3px;color:var(--vino);margin:0;text-transform:uppercase;text-align:right}
.volver{font-size:14px;font-weight:bold;color:var(--vino);text-decoration:none}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(59,43,43,.07)}
.ctit{font-family:var(--mono);font-size:12px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:var(--vino);margin:0 0 10px}
.flbl{font-family:var(--mono);font-size:10.5px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin-bottom:5px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;font:16px Arial,Helvetica,sans-serif;padding:11px;border:1px solid #d8c3b4;border-radius:8px;background:#fff;color:var(--texto)}
input.monto{font-size:19px;font-weight:bold;color:var(--vino)}
input:focus,select:focus{outline:2px solid var(--azul);outline-offset:1px}
.info{font-size:13.5px;color:var(--gris);margin-top:10px;line-height:1.5}
.info b{color:var(--texto)}
.ayuda{font-size:12px;color:var(--gris);margin-top:5px}
.atajos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--celeste);background:#fff;color:var(--texto);border-radius:999px;padding:8px 12px;font:bold 13px Arial,Helvetica,sans-serif;cursor:pointer}
.chip:active{background:var(--crema)}
.tasa{display:flex;justify-content:space-between;gap:10px;background:var(--crema);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
.tasa b{color:var(--vino)}
.aviso{background:#fff4e5;border-left:4px solid #c77d1a;color:#6b4200;font-size:13px;padding:8px 10px;border-radius:6px;margin-bottom:10px}
.linea{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.linea .l{font-family:var(--mono);font-size:10.5px;font-weight:bold;letter-spacing:1.3px;text-transform:uppercase;color:var(--gris)}
.linea .l small{display:block;font-family:Arial,Helvetica,sans-serif;letter-spacing:0;text-transform:none;font-weight:normal;font-size:12px;margin-top:2px}
.linea .v{font-size:16.5px;font-weight:bold;white-space:nowrap;text-align:right}
.linea.desc .v{color:var(--oliva)}
.linea[hidden]{display:none}
.total{background:var(--vino);color:var(--crema);border-radius:10px;padding:14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.total .l{font-family:var(--mono);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
.total .v{font-size:23px;font-weight:bold}
.comp{font-size:12.5px;color:var(--gris);margin-top:12px;line-height:1.5;background:var(--crema);border-radius:8px;padding:9px 11px}
.generar{width:100%;margin-top:12px;background:var(--vino);color:var(--crema);border:0;border-radius:10px;padding:14px;font:bold 15px Arial,Helvetica,sans-serif;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="volver" id="volver" href="/cotizador/">← Cotizador</a>
    <img src="img/logo.png" alt="La Vuelta">
    <h1>Calculadora</h1>
  </header>

  <div class="card">
    <div class="grid">
      <div><label class="flbl" for="piso">Piso</label><select id="piso"></select></div>
      <div><label class="flbl" for="unidad">Departamento</label><select id="unidad"></select></div>
    </div>
    <div class="info" id="info">Cargando…</div>
  </div>

  <div class="card">
    <p class="ctit">Descuento al precio</p>
    <div class="grid">
      <div><label class="flbl" for="dTipo">Tipo</label><select id="dTipo"><option value="p">Porcentaje %</option><option value="m">Monto $</option></select></div>
      <div><label class="flbl" for="dVal">Valor</label><input id="dVal" class="monto" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    </div>
    <div class="atajos" id="atajosDesc">
      <button type="button" class="chip" data-d="0">Sin descuento</button>
      <button type="button" class="chip" data-d="2">2%</button>
      <button type="button" class="chip" data-d="3">3%</button>
      <button type="button" class="chip" data-d="5">5%</button>
    </div>
  </div>

  <div class="card">
    <p class="ctit">Plan del cliente</p>
    <div class="grid">
      <div><label class="flbl" for="entrada">Entrada $</label><input id="entrada" class="monto" type="text" inputmode="decimal" autocomplete="off"><div class="ayuda" id="ayEnt"></div></div>
      <div><label class="flbl" for="anticipado">Pago anticipado $</label><input id="anticipado" class="monto" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><div class="ayuda">al firmar</div></div>
      <div><label class="flbl" for="cuotas">N° de cuotas</label><input id="cuotas" type="number" inputmode="numeric" min="0" step="1"><div class="ayuda" id="ayN"></div></div>
      <div><label class="flbl" for="cuota">Valor de cuota $</label><input id="cuota" class="monto" type="text" inputmode="decimal" autocomplete="off"><div class="ayuda" id="ayCuo"></div></div>
    </div>
    <div class="atajos">
      <button type="button" class="chip" data-a="estandar">Plan estándar</button>
      <button type="button" class="chip" data-a="redondear">Redondear cuota</button>
      <button type="button" class="chip" data-a="sin-cuotas">Sin cuotas</button>
      <button type="button" class="chip" data-a="todo">Pagar todo en construcción</button>
    </div>
    <div class="tasa" id="bTasa"></div>
  </div>

  <div class="card">
    <div id="avisos"></div>
    <div class="linea"><span class="l">Valor del departamento</span><span class="v" id="rPrecio"></span></div>
    <div class="linea desc" id="fCom"><span class="l">Descuento al precio<small id="sCom"></small></span><span class="v" id="rCom"></span></div>
    <div class="linea" id="fNeto"><span class="l">Precio con descuento</span><span class="v" id="rNeto"></span></div>
    <div class="linea"><span class="l" id="lEntrada">Entrada</span><span class="v" id="rEntrada"></span></div>
    <div class="linea" id="fAnt"><span class="l">Pago anticipado<small>al firmar</small></span><span class="v" id="rAnt"></span></div>
    <div class="linea" id="fCuo"><span class="l">Durante la construcción<small id="sCuo"></small></span><span class="v" id="rCuo"></span></div>
    <div class="linea"><span class="l">Contra entrega<small id="sCE"></small></span><span class="v" id="rCE"></span></div>
    <div class="linea desc" id="fPP"><span class="l">Descuento por pronto pago<small id="sDesc"></small></span><span class="v" id="rDesc"></span></div>
    <div class="total"><span class="l">Precio final</span><span class="v" id="rFinal"></span></div>
    <div class="comp" id="comp"></div>
    <button class="generar" id="btnCot" type="button">Generar cotización con este plan</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const CFG=window.LV_CONFIG;
const usd=n=>lvUSD(n);
const num=el=>lvNumero(el.value);
const fmt=v=>lvFmtEntrada(v);
const r2=x=>Math.round(x*100)/100;
const qs=new URLSearchParams(location.search);
let U=[], entEditada=false, cuoEditada=false, ultimo=null;

const actual=()=>U.find(u=>u.unidad===$("#unidad").value);
function llenarUnidades(){
  $("#unidad").innerHTML=U.filter(u=>u.piso===$("#piso").value).map(u=>{
    const ok=(u.estado||"").toLowerCase()==="disponible";
    return `<option value="${u.unidad}" ${ok?"":"disabled"}>${u.unidad} · Tipo ${u.tipologia}${ok?"":" · "+u.estado}</option>`;
  }).join("");
  const p=[...$("#unidad").options].find(o=>!o.disabled); if(p) $("#unidad").value=p.value;
}
const base=()=>{ const u=actual(); return u?lvDescuento(u.precio,$("#dTipo").value,num($("#dVal"))):null; };
function valoresPorDefecto(){                     // 5% de entrada y 25% en cuotas, sobre el precio con descuento
  const b=base(); if(!b) return;
  if(!entEditada) $("#entrada").value=fmt(r2(b.neto*CFG.entradaPct/100));
  const n=Math.round(num($("#cuotas")));
  if(!cuoEditada) $("#cuota").value=n?fmt(r2(b.neto*CFG.cuotasPct/100/n)):"";
}
function estandar(){ entEditada=false; cuoEditada=false; $("#anticipado").value=""; $("#cuotas").value=CFG.plazoMeses; valoresPorDefecto(); }

function calcular(){
  const u=actual(); if(!u) return;
  valoresPorDefecto();
  const dc=base(), neto=dc.neto;
  const p=lvPlan(neto,{entrada:num($("#entrada")),anticipado:num($("#anticipado")),cuotas:num($("#cuotas")),cuota:num($("#cuota"))});
  ultimo={p,dc};
  $("#info").innerHTML=`<b>Dpt ${u.unidad}</b> · Piso ${u.piso} · Tipología ${u.tipologia} · ${u.dormitorios} dorm. · ${lvFmt(+u.area_total)} m²`;
  $("#ayEnt").textContent=`${lvFmt(p.entradaPct)}% del precio`;
  $("#ayN").textContent=`máximo ${CFG.plazoMeses} (construcción)`;
  $("#ayCuo").textContent=p.n?`total ${usd(p.total)} · ${lvFmt(p.total/neto*100)}%`:"sin cuotas";
  $("#bTasa").innerHTML=`<span>Pronto pago: compara con las condiciones iniciales (5% · 25% en cuotas · 70%). Suma lo que se paga antes y resta lo que se deja de pagar en la obra, al</span><b>${p.tasa}% anual</b>`;
  $("#avisos").innerHTML=p.avisos.map(a=>`<div class="aviso">${a}</div>`).join("");
  $("#rPrecio").textContent=usd(u.precio);
  $("#fCom").hidden=!dc.desc; $("#fNeto").hidden=!dc.desc;
  $("#sCom").textContent=`${lvFmt(dc.pct)}% del precio de lista`; $("#rCom").textContent="− "+usd(dc.desc); $("#rNeto").textContent=usd(neto);
  $("#lEntrada").textContent=`Entrada (${lvFmt(p.entradaPct).replace(/,00$/,"")}%)`; $("#rEntrada").textContent=usd(p.E);
  $("#fAnt").hidden=!p.A; $("#rAnt").textContent=usd(p.A);
  $("#fCuo").hidden=!p.n; $("#sCuo").textContent=`${p.n} cuotas de ${usd(p.c)}`; $("#rCuo").textContent=usd(p.total);
  $("#sCE").textContent=`al mes ${p.plazo}`; $("#rCE").textContent=usd(p.CE);
  $("#fPP").hidden=!p.D; $("#sDesc").textContent=`frente a las condiciones iniciales`; $("#rDesc").textContent="− "+usd(p.D);
  $("#rFinal").textContent=usd(p.final);
  const s=lvPlan(neto,{});
  $("#comp").innerHTML=`<b>Condiciones iniciales:</b> entrada ${usd(s.E)} · ${s.n} cuotas de ${usd(s.c)} · contra entrega ${usd(s.CE)}.<br>El descuento al precio es directo, sin tasa. El pronto pago se aplica al contra entrega.`;
}

$("#entrada").addEventListener("input",()=>{ entEditada=true; calcular(); });
$("#cuota").addEventListener("input",()=>{ cuoEditada=true; calcular(); });
$("#anticipado").addEventListener("input",calcular);
$("#dVal").addEventListener("input",()=>{ entEditada=false; cuoEditada=false; calcular(); });
$("#cuotas").addEventListener("input",calcular);
$("#dTipo").addEventListener("change",()=>{ entEditada=false; cuoEditada=false; calcular(); });
["#entrada","#anticipado","#cuota"].forEach(s=>$(s).addEventListener("blur",e=>{ e.target.value=fmt(num(e.target)); }));
$("#atajosDesc").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; entEditada=false; cuoEditada=false; $("#dTipo").value="p"; $("#dVal").value=+b.dataset.d?b.dataset.d:""; calcular(); });
document.querySelectorAll(".atajos")[1].addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const a=b.dataset.a, n=Math.round(num($("#cuotas")));
  if(a==="estandar") estandar();
  if(a==="redondear" && n){ $("#cuota").value=fmt(Math.round(num($("#cuota"))/10)*10); cuoEditada=true; }
  if(a==="sin-cuotas"){ $("#cuotas").value=0; $("#cuota").value=""; cuoEditada=true; }
  if(a==="todo"){ const b=base(); if(n<1) $("#cuotas").value=CFG.plazoMeses; const nn=Math.round(num($("#cuotas")));
    const pr=lvPlan(b.neto,{entrada:num($("#entrada")),anticipado:num($("#anticipado")),cuotas:nn,cuota:0});
    $("#cuota").value=fmt(Math.floor((b.neto-pr.E-pr.A-pr.D)/nn*100)/100); cuoEditada=true; }
  calcular();
});
$("#piso").addEventListener("change",()=>{ entEditada=false; cuoEditada=false; llenarUnidades(); calcular(); });
$("#unidad").addEventListener("change",()=>{ entEditada=false; cuoEditada=false; calcular(); });
$("#btnCot").addEventListener("click",()=>{
  const u=actual(); if(!u||!ultimo) return; const {p}=ultimo;
  const q=new URLSearchParams(); ["nombre","cel","correo","ci"].forEach(k=>{ if(qs.get(k)) q.set(k,qs.get(k)); });
  q.set("unidad",u.unidad); { const dv=num($("#dVal")); if(dv){ q.set("dt",$("#dTipo").value); q.set("dv",dv); } }
  q.set("plan","p"); q.set("e",p.E); q.set("ant",p.A); q.set("n",p.n); q.set("c",p.c);
  location.href="/cotizador/?"+q;
});
{ const q=new URLSearchParams(); ["nombre","cel","correo","ci","unidad"].forEach(k=>{ if(qs.get(k)) q.set(k,qs.get(k)); }); $("#volver").href="/cotizador/"+(q.toString()?"?"+q:""); }

lvCargarUnidades().then(datos=>{
  U=datos; U.forEach(u=>{u.precio=+u.precio;});
  $("#piso").innerHTML=[...new Set(U.map(u=>u.piso))].map(p=>`<option value="${p}">Piso ${p}</option>`).join("");
  const pedida=qs.get("unidad") && U.find(u=>u.unidad===qs.get("unidad"));
  if(pedida) $("#piso").value=pedida.piso;
  llenarUnidades(); if(pedida) $("#unidad").value=pedida.unidad;
  if(qs.get("dv")){ $("#dTipo").value=qs.get("dt")==="m"?"m":"p"; $("#dVal").value=qs.get("dv"); }
  estandar();
  if(qs.get("plan")==="p"){
    if(qs.get("e")){ $("#entrada").value=fmt(+qs.get("e")); entEditada=true; }
    $("#anticipado").value=fmt(+qs.get("ant")||0); $("#cuotas").value=qs.get("n")??CFG.plazoMeses;
    if(qs.get("c")){ $("#cuota").value=fmt(+qs.get("c")); cuoEditada=true; }
  }
  calcular();
}).catch(()=>{ $("#info").textContent="No se pudo leer unidades.csv."; });
</script>
</body>
</html>
