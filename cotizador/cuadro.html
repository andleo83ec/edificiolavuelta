<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/cotizador/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faede1">
<title>Cuadro de disponibilidad · La Vuelta</title>
<script src="plan.js"></script>
<style>
:root{--vino:#8c2628;--crema:#faede1;--celeste:#b1c3c7;--azul:#4a94c4;--texto:#3b2b2b;--gris:#6f5f5f;--linea:#e3cfc2;--oliva:#6b7a4f;--mono:"Courier New",Courier,monospace;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--texto);font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.barra{max-width:1160px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barra a{color:var(--vino);font-weight:bold;font-size:14px;text-decoration:none}
.barra .esp{flex:1}
.barra .est{font-size:12.5px;color:var(--gris)}
button{font:bold 15px Arial,Helvetica,sans-serif;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--vino);color:var(--crema)}
button:disabled{opacity:.6}
button:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.vista{max-width:1160px;margin:0 auto;padding:0 16px 30px}
.escala{transform-origin:top left}

/* ---------- Hoja A4 horizontal (1123 × 794 px) ---------- */
.hoja{width:1123px;height:794px;background:var(--crema);position:relative;overflow:hidden;padding:26px 36px 0;box-shadow:0 2px 14px rgba(59,43,43,.18)}
.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.top img{height:56px}
h1{margin:0;font-family:var(--mono);letter-spacing:5px;font-size:19px;color:var(--vino);text-transform:uppercase}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--gris);text-transform:uppercase;margin-top:4px}
table{width:100%;border-collapse:separate;border-spacing:1.3px;table-layout:fixed}
thead th{background:var(--vino);color:var(--crema);font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;padding:4px 2px;text-transform:uppercase}
th.tip{width:152px;text-align:left;background:#fff;padding:1px 6px;font-weight:normal;white-space:nowrap}
thead th.tip{background:var(--vino);color:var(--crema);padding-left:6px}
th.tip b{font-family:var(--mono);color:var(--vino);font-size:11px;margin-right:4px}
th.tip span{font-size:8px;color:var(--gris)}
td{height:24.6px;text-align:center;font-size:8.2px;line-height:1.08;padding:0 1px}
td b{display:block;font-size:9.4px}
td span{display:block}
td.disp{background:#fff;color:var(--texto);border-left:3px solid var(--oliva)}
td.res{background:var(--vino);color:var(--crema);border-left:3px solid var(--vino)}
td.ven{background:var(--gris);color:#fff;border-left:3px solid var(--gris)}
td.cnt{background:var(--celeste);color:#fff;font-weight:bold;font-size:9.5px;width:44px}
tfoot th{background:var(--celeste);color:#fff;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-align:right;padding-right:6px}
.ley{display:flex;gap:16px;align-items:center;font-size:9.5px;color:var(--gris);margin-top:9px}
.sw{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:4px}
.pie{position:absolute;left:0;right:0;bottom:0;background:var(--celeste);color:#fff;font-family:var(--mono);font-size:9px;letter-spacing:1px;font-weight:bold;text-transform:uppercase;text-align:center;padding:9px}

@media print{
  @page{size:A4 landscape;margin:0}
  .barra{display:none}
  .vista{padding:0;max-width:none}
  .escala{transform:none!important;height:auto!important}
  .hoja{box-shadow:none;width:297mm;height:210mm}
}
</style>
</head>
<body>
<div class="barra">
  <a href="/cotizador/">← Cotizador</a>
  <span class="esp"></span>
  <span class="est" id="estado">Cargando disponibilidad…</span>
  <button id="btnPdf" type="button" disabled>Descargar PDF</button>
</div>

<div class="vista"><div class="escala" id="escala">
  <section class="hoja" id="hoja">
    <div class="top">
      <img src="img/logo.png" alt="La Vuelta">
      <div><h1>Cuadro de disponibilidad</h1><div class="sub" id="sub"></div></div>
    </div>
    <table id="tabla"></table>
    <div class="ley">
      <span><i class="sw" style="background:#fff;border-left:3px solid #6b7a4f"></i>Disponible</span>
      <span><i class="sw" style="background:#8c2628"></i>Reservado</span>
      <span><i class="sw" style="background:#6f5f5f"></i>Vendido</span>
      <span>D = dormitorios · B = baños · s/parq. = sin parqueadero ni bodega · Precios en USD</span>
    </div>
    <div class="pie">Un proyecto de Grupo León Vintimilla · con Construlein León Iñiguez · WhatsApp +593 98 334 7804 · www.edificiolavuelta.com</div>
  </section>
</div></div>

<script>
const $=s=>document.querySelector(s);
const k=n=>lvUSD(n,0);
const hoy=new Date(), fecha=hoy.toLocaleDateString("es-EC",{day:"2-digit",month:"2-digit",year:"numeric"});

function pintar(U){
  const pisos=[...new Set(U.map(u=>+u.piso))].sort((a,b)=>a-b);
  const tipos=[...new Set(U.map(u=>u.tipologia))].sort();
  const by={}; U.forEach(u=>by[u.tipologia+"-"+(+u.piso)]=u);
  const cls=u=>u.estado==="Reservado"?"res":u.estado==="Vendido"?"ven":"disp";
  const disp=u=>u&&u.estado==="Disponible";
  const filas=tipos.map(t=>{
    const b=pisos.map(p=>by[t+"-"+p]).find(Boolean);
    const info=`${b.dormitorios}D · ${b.banos}B · ${lvFmt(+b.area_interna)} m²${+b.parqueo?"":" · s/parq."}`;
    const celdas=pisos.map(p=>{ const u=by[t+"-"+p]; return u?`<td class="${cls(u)}"><b>${u.unidad}</b><span>${k(u.precio)}</span></td>`:"<td></td>"; }).join("");
    return `<tr><th class="tip"><b>${t}</b><span>${info}</span></th>${celdas}<td class="cnt">${pisos.filter(p=>disp(by[t+"-"+p])).length}</td></tr>`;
  }).join("");
  const pie=pisos.map(p=>`<td class="cnt">${tipos.filter(t=>disp(by[t+"-"+p])).length}</td>`).join("");
  const total=U.filter(disp).length;
  $("#tabla").innerHTML=`<thead><tr><th class="tip">Tipología</th>${pisos.map(p=>`<th>Piso ${p}</th>`).join("")}<th>Disp.</th></tr></thead>
    <tbody>${filas}</tbody><tfoot><tr><th>Disponibles por piso</th>${pie}<td class="cnt">${total}</td></tr></tfoot>`;
  $("#sub").textContent=`Edificio La Vuelta · Pisos ${pisos[0]} al ${pisos[pisos.length-1]} · ${tipos.length} tipologías · Corte al ${fecha}`;
  const nr=U.filter(u=>u.estado==="Reservado").length, nv=U.filter(u=>u.estado==="Vendido").length;
  $("#estado").textContent=`${total} disponibles · ${nr} reservados · ${nv} vendidos`;
}

function escalar(){
  const w=$(".vista").clientWidth-32, s=Math.min(1,w/1123), e=$("#escala");
  e.style.transform=`scale(${s})`; e.style.height=(794*s)+"px";
}
window.addEventListener("resize",escalar);

/* ---------- PDF ---------- */
function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error(src)); document.head.appendChild(s); }); }
async function generarPDF(){
  if(!window.html2canvas) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const c=$("#hoja").cloneNode(true); c.style.boxShadow="none";
  const cont=document.createElement("div"); cont.style.cssText="position:fixed;left:-10000px;top:0;width:1123px"; cont.appendChild(c); document.body.appendChild(cont);
  await Promise.all([...cont.querySelectorAll("img")].map(i=>i.complete&&i.naturalWidth?0:new Promise(r=>{i.onload=i.onerror=r;})));
  try{
    const cv=await html2canvas(c,{scale:2,backgroundColor:"#faede1",logging:false});
    const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
    pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,297,210);
    return pdf.output("blob");
  } finally { cont.remove(); }
}
$("#btnPdf").addEventListener("click",async e=>{
  const b=e.currentTarget, t=b.textContent; b.disabled=true; b.textContent="Preparando PDF…";
  try{
    const blob=await generarPDF(), nombre=`Disponibilidad_LaVuelta_${fecha.replace(/\//g,"-")}.pdf`;
    const file=new File([blob],nombre,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:nombre}); } catch(err){ if(err.name!=="AbortError") throw err; } }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(err){ console.error(err); alert("No se pudo generar el PDF. Puedes usar Compartir → Imprimir como alternativa."); }
  finally{ b.disabled=false; b.textContent=t; }
});

lvCargarUnidades().then(U=>{ U.forEach(u=>u.precio=+u.precio); pintar(U); escalar(); $("#btnPdf").disabled=false; })
  .catch(()=>{ $("#estado").textContent="No se pudo leer la disponibilidad."; });
</script>
</body>
</html>
